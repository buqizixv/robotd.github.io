Your ONLY output is the article JSON file. Write it to `D:\新建文件夹\000\articles\[slug].json` following the _TEMPLATE.json format (bilingual EN/中文, 1000+ words each body, use 「」 for Chinese quotes inside strings, use regular quotes for English).

You MUST NOT:
- Modify `content.js` or `app.js`
- Modify `index.html` or bump cache versions
- Do anything beyond creating the article JSON file

After you finish writing the JSON file, your job is done. The main Codex will handle manifest insertion, cache busting, and server restart — under Boss's review.

